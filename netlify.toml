[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The main branch is TEST. Keep production credentials in its separate context.
[context.main.environment]
  VITE_SUPABASE_URL = "https://slophgtrynlfesjonbzf.supabase.co"

# Single Page App routing: redirect all routes to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
